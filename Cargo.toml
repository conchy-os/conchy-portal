[workspace]
resolver = "3"
members = ["crates/proto", "crates/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/conchy-os/conchy-portal"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
zvariant = "5"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "net", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
kdl = "4.6"
tempfile = "3"
conchy-config = { path = "../conchy-config" }
conchy-portal-proto = { path = "crates/proto" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
